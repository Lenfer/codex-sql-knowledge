<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
<title id="architecture-title">SQL Knowledge architecture</title><desc id="architecture-desc">Three local clients send writes through one coordinator to a project database; reads use independent connections.</desc>
<defs>
      <style>#architecture-root { color: #30332e; }
      #architecture-root text { font-family:Arial,Helvetica,sans-serif;fill:#30332e }
      #architecture-root .title { font:38px Georgia,serif;letter-spacing:-.6px }
      #architecture-root .heading { font-size:22px;font-weight:600 }
      #architecture-root .body { font-size:18px }
      #architecture-root .small { font-size:16px;fill:#656b60 }
      #architecture-root .code { font:15px Menlo,Consolas,monospace;fill:#656b60 }</style><marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#656b60"/></marker></defs>
<rect width="960" height="600" fill="#f7f4ed"/><text x="40" y="48" class="eyebrow">SQL KNOWLEDGE / PROJECT MEMORY</text><text x="40" y="104" class="title">One project. A memory you can inspect.</text><text x="40" y="144" class="body">Shared runtime; explicit project root; records with sources.</text><path d="M236 252 H276 Q284 252 284 260 V296 Q284 304 292 304 H320" fill="none" stroke="#656b60" stroke-width="1.5" marker-end="url(#architecture-arrow)"/><path d="M236 340 H320" fill="none" stroke="#656b60" stroke-width="1.5" marker-end="url(#architecture-arrow)"/><path d="M236 428 H284 Q292 428 292 420 V384 Q292 376 300 376 H320" fill="none" stroke="#656b60" stroke-width="1.5" marker-end="url(#architecture-arrow)"/><path d="M560 340 H640" fill="none" stroke="#656b60" stroke-width="1.5" marker-end="url(#architecture-arrow)"/><text x="578" y="316" class="code">commit</text><rect x="40" y="216" width="196" height="72" rx="6" fill="#fffefa" stroke="#d6d8cf" stroke-width="1.5"/><text x="56" y="244" class="heading">Agent chat</text><text x="56" y="268" class="code">stdio MCP</text><rect x="40" y="304" width="196" height="72" rx="6" fill="#fffefa" stroke="#d6d8cf" stroke-width="1.5"/><text x="56" y="332" class="heading">Another chat</text><text x="56" y="356" class="code">stdio MCP</text><rect x="40" y="392" width="196" height="72" rx="6" fill="#fffefa" stroke="#d6d8cf" stroke-width="1.5"/><text x="56" y="420" class="heading">CLI</text><text x="56" y="444" class="code">explicit --project</text><rect x="320" y="272" width="240" height="136" rx="6" fill="#f0e1d6" stroke="#a75035" stroke-width="1.5"/><text x="340" y="308" class="heading">Project writer</text><text x="340" y="340" class="body">Revision checks</text><text x="340" y="368" class="body">Idempotent retries</text><text x="340" y="392" class="code">Local Unix socket</text><rect x="640" y="248" width="280" height="184" rx="6" fill="#fffefa" stroke="#d6d8cf" stroke-width="1.5"/><text x="660" y="284" class="heading">knowledge.sqlite</text><text x="660" y="320" class="body">Records + evidence</text><text x="660" y="350" class="body">History + receipts</text><text x="660" y="396" class="code">SQLite WAL / FULL</text><path d="M40 500 H920" stroke="#d6d8cf"/><text x="40" y="536" class="body">Reads use independent connections to the project database.</text><text x="40" y="568" class="small">Each MCP server binds to one explicitly chosen project root.</text></svg>
