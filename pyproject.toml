[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sql-knowledge"
version = "0.2.0.dev2"
description = "Project-local SQLite knowledge via typed MCP, without SQL dumps"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0,<2", "pydantic>=2,<3"]
[project.scripts]
sql-knowledge = "sql_knowledge.__main__:main"
sql-knowledge-mcp = "sql_knowledge.mcp:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"sql_knowledge" = ["profiles/mavis/*.toml", "profiles/mavis/*.sql"]
"sql_knowledge._core" = ["schema.sql"]
